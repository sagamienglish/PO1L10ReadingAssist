<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 10 Reading Trainer</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- アイコン用 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Centuryフォントを優先指定 */
        body {
            font-family: 'Century', 'Times New Roman', serif;
            background-color: #f4f7f6;
            color: #333;
        }
        /* 日本語部分（UIなど）は見やすくゴシック体 */
        .ui-font {
            font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }
        
        /* 教科書テーマカラー (画像から抽出した青緑) */
        .theme-bg {
            background-color: #3EA39E; 
        }
        .theme-text {
            color: #2D7A76; /* 文字用に少し暗く調整 */
        }
        .theme-border {
            border-color: #3EA39E;
        }
        
        /* 隠れた単語のスタイル */
        .hidden-word {
            cursor: pointer;
            transition: all 0.2s;
        }
        .hidden-word:hover {
            opacity: 0.8;
        }
        /* クリックして表示された単語のスタイル */
        .revealed-word {
            color: #d97706; /* 琥珀色で強調 */
            font-weight: bold;
            cursor: pointer;
        }

        /* 読み上げ中のハイライト */
        .speaking-highlight {
            color: #2D7A76 !important; /* theme-textと同じ色 */
            font-weight: bold;
            transition: color 0.3s;
        }
        
        /* 読み上げ可能な単語（カーソル変更） */
        .speakable-word {
            cursor: pointer;
        }
        .speakable-word:hover {
            opacity: 0.7;
        }

        /* スクロールバーのカスタマイズ */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }
        
        /* ボタンのアニメーション */
        .active-play-btn {
            background-color: #fef3c7 !important; /* amber-100 */
            color: #d97706 !important; /* amber-600 */
            border: 1px solid #f59e0b;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // 教科書データ
        const lessonData = {
            part1: [
                { text: "Yoshida Nagi is a unique photographer. She often", indent: true },
                { text: "takes pictures in Africa and other places around the", indent: false },
                { text: "world.", indent: false },
                { text: "Yoshida became interested in African ethnic groups", indent: true },
                { text: "when she was five years old. She happened to see the", indent: false },
                { text: "Masai people, one of the ethnic groups in Africa, on TV.", indent: false },
                { text: "She did not know why, but she became strongly attracted", indent: false },
                { text: "to the Masai. She even thought, \"I wish I were a member", indent: false },
                { text: "of their tribe.\" Soon after that, going to Africa became", indent: false },
                { text: "one of her dreams.", indent: false },
                { text: "She stopped going to junior high school in second", indent: true },
                { text: "grade because she had trouble fitting in. In fact, she was", indent: false },
                { text: "bullied in both elementary and junior high schools. After", indent: false },
                { text: "leaving school, she worked for several years and saved", indent: false },
                { text: "money. Her childhood dream came true in 2009, when", indent: false },
                { text: "she was 23 years old. She finally visited Africa.", indent: false }
            ],
            part2: [
                { text: "Why did Yoshida begin taking photos? She wanted to", indent: true },
                { text: "show that Africa and the people there were attractive.", indent: false },
                { text: "Almost everyone around her thought of Africa as a", indent: false },
                { text: "hungry, poor, and violent place. She thought photos", indent: false },
                { text: "would help them understand the continent better.", indent: false },
                { text: "In addition, she wanted to take photos of African", indent: true },
                { text: "people in their traditional costumes. Nowadays, some", indent: false },
                { text: "young people in the ethnic groups avoid wearing their", indent: false },
                { text: "traditional clothes. She believes that taking photos of", indent: false },
                { text: "people in their clothes might help pass their traditions on", indent: false },
                { text: "to following generations.", indent: false },
                { text: "However, it was difficult to take good photos at first.", indent: true },
                { text: "\"The trust between a photographer and their subjects is", indent: false },
                { text: "important,\" says Yoshida. \"If they don't trust a photographer,", indent: false },
                { text: "they will not show who or what they really are.\"", indent: false },
                { text: "To gain their trust, she behaved as if she were an", indent: true },
                { text: "African woman. She wore the same costume, ate the same", indent: false },
                { text: "meals, and put on the same make-up. This led to her success.", indent: false }
            ],
            part3: [
                { text: "Look at the left photo above. This photo, which", indent: true },
                { text: "Yoshida took in 2015, changed her life. It is a photo of", indent: false },
                { text: "people who belong to the Suri Tribe in Ethiopia. Luckily, it", indent: false },
                { text: "was featured in a TV program that year, and it made her", indent: false },
                { text: "famous. Although she had not expected to become a", indent: false },
                { text: "photographer, she ended up becoming a professional one.", indent: false },
                { text: "So far, she has taken pictures of more than 200 ethnic", indent: true },
                { text: "groups in Africa. Now, she takes pictures of people around", indent: false },
                { text: "the world who look beautiful to her. For example, she has", indent: false },
                { text: "been to the Amazon region, as well as several Asian", indent: false },
                { text: "countries.", indent: false },
                { text: "Why do people in Yoshida's pictures look beautiful?", indent: true },
                { text: "She seems to bring out the beauty in people everywhere.", indent: false },
                { text: "Yoshida says, \"Being different is one of the most beautiful", indent: false },
                { text: "things on Earth. If we were all the same, the world would", indent: false },
                { text: "be boring.\"", indent: false }
            ]
        };

        const newWordsList = {
            part1: ["happened", "strongly", "tribe", "grade", "fitting", "bullied", "came", "true", "ethnic", "childhood"],
            part2: ["violent", "continent", "avoid", "might", "behaved", "make-up", "attractive", "thought", "addition", "pass", "subjects"],
            part3: ["ethiopia", "luckily", "program", "expected", "amazon", "region", "featured", "well"]
        };

        const functionWords = new Set([
            "is", "am", "are", "was", "were", "be", "been", "being",
            "do", "does", "did", "have", "has", "had", 
            "will", "would", "can", "could", "shall", "should", "may", "might", "must",
            "i", "you", "he", "she", "it", "we", "they", "me", "him", "her", "us", "them",
            "my", "your", "his", "its", "our", "their", "mine", "yours", "hers", "ours", "theirs",
            "this", "that", "these", "those", "who", "which", "what", "where", "when", "why", "how",
            "a", "an", "the", "in", "on", "at", "to", "for", "from", "of", "with", "by", "about", 
            "as", "into", "like", "through", "after", "over", "between", "out", 
            "against", "during", "without", "before", "under", "around", "among",
            "and", "but", "or", "so", "because", "if", "while", "although", "though", "since",
            "not", "no", "yes", "there", "here"
        ]);

        const properNouns = new Set([
            "Yoshida", "Nagi", "Africa", "African", "Masai", "TV", "Ethiopia", 
            "Suri", "Tribe", "Amazon", "Asian", "Earth"
        ]);

        // Helpers
        const isNewWord = (word, part) => {
            const cleanWord = word.toLowerCase().replace(/^[^\w]+|[^\w]+$/g, '');
            const targetList = newWordsList[part] || [];
            return targetList.includes(cleanWord);
        };
        const isFunctionWord = (word) => {
            const cleanWord = word.toLowerCase().replace(/^[^\w]+|[^\w]+$/g, '');
            return functionWords.has(cleanWord);
        };
        const isProperNounOrNumber = (word) => {
            const cleanWord = word.replace(/[^\w\d]/g, ''); 
            if (/^\d+$/.test(cleanWord)) return true;
            return properNouns.has(cleanWord);
        };

        // --- COMPONENTS ---

        // Voice Settings Modal
        const VoiceSettingsModal = ({ isOpen, onClose, voices, selectedVoiceURI, onSelectVoice }) => {
            if (!isOpen) return null;
            
            // 優先したい音声名のリスト
            const preferredNames = [
                'Google US English', 
                'Samantha', // iOS default High Quality
                'Daniel',   // iOS UK
                'Arthur', 
                'Martha', 
                'Karen', 
                'Microsoft Zira'
            ];

            // 厳選ロジック
            let curatedVoices = [];
            
            // 1. 優先リストにあるものを探す
            preferredNames.forEach(name => {
                const found = voices.find(v => v.name.includes(name));
                if (found) curatedVoices.push(found);
            });

            // 2. もし優先リストのものが少なすぎたら、他の英語音声を追加して5つくらいにする
            if (curatedVoices.length < 5) {
                const otherEnglish = voices.filter(v => 
                    v.lang.startsWith('en') && 
                    !curatedVoices.includes(v) &&
                    !v.name.includes('Fred') && // Fredなどは特殊すぎるので除外
                    !v.name.includes('Albert')
                );
                
                // US/UKを優先して追加
                otherEnglish.sort((a, b) => {
                    if (a.lang === 'en-US' && b.lang !== 'en-US') return -1;
                    if (a.lang === 'en-GB' && b.lang !== 'en-GB') return -1;
                    return 0;
                });

                // 足りない分を追加
                curatedVoices = [...curatedVoices, ...otherEnglish.slice(0, 6 - curatedVoices.length)];
            }

            // 重複排除
            curatedVoices = [...new Set(curatedVoices)];

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full ui-font overflow-hidden flex flex-col max-h-[80vh]">
                        <div className="p-4 border-b bg-gray-50 flex justify-between items-center flex-shrink-0">
                            <h3 className="font-bold text-gray-700">Voice Settings</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-grow">
                            <p className="text-sm text-gray-600 mb-4">
                                Select a preferred voice:
                            </p>
                            <div className="space-y-2">
                                {curatedVoices.map(voice => (
                                    <button
                                        key={voice.voiceURI}
                                        onClick={() => onSelectVoice(voice.voiceURI)}
                                        className={`w-full text-left p-3 rounded border transition-all flex justify-between items-center ${
                                            selectedVoiceURI === voice.voiceURI 
                                            ? 'bg-teal-50 border-teal-500 text-teal-800' 
                                            : 'border-gray-200 hover:bg-gray-50'
                                        }`}
                                    >
                                        <div className="flex flex-col">
                                            <span className="font-bold text-sm">{voice.name}</span>
                                            <span className="text-xs text-gray-500">{voice.lang}</span>
                                        </div>
                                        {selectedVoiceURI === voice.voiceURI && <i className="fas fa-check text-teal-600"></i>}
                                    </button>
                                ))}
                                {curatedVoices.length === 0 && (
                                    <p className="text-red-500 text-sm">No English voices found on this device.</p>
                                )}
                            </div>
                        </div>
                        <div className="p-4 border-t bg-gray-50 text-right flex-shrink-0">
                            <button 
                                onClick={onClose}
                                className="px-4 py-2 bg-theme-bg text-white rounded hover:opacity-90 transition-colors font-bold"
                            >
                                Done
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentPart, setCurrentPart] = useState('part1');
            const [level, setLevel] = useState(1);
            const [revealedKeys, setRevealedKeys] = useState(new Set()); 
            const [speakingRange, setSpeakingRange] = useState(null); 
            const [isFullPlaying, setIsFullPlaying] = useState(false);
            const [isPaused, setIsPaused] = useState(false);
            const [voices, setVoices] = useState([]);
            const [playbackRate, setPlaybackRate] = useState(1.0); 
            const [level3HiddenKeys, setLevel3HiddenKeys] = useState(new Set());
            
            // Voice Settings
            const [selectedVoiceURI, setSelectedVoiceURI] = useState(null);
            const [isVoiceSettingsOpen, setIsVoiceSettingsOpen] = useState(false);
            
            // Ref for managing chained playback
            const playbackRef = useRef({
                sentences: [],
                currentIndex: -1,
                isPausedFlag: false
            });

            // パートやレベルが変わったら停止
            useEffect(() => {
                setRevealedKeys(new Set());
                stopPlayback();
            }, [currentPart, level]);

            // 優先音声選択ロジック（リストを渡す形に変更）
            const getPreferredVoice = useCallback((voiceList) => {
                const list = voiceList || voices;
                if (!list || list.length === 0) return null;
                
                // 1. Google US English (Chrome/Android High Quality)
                const googleUS = list.find(v => v.name === 'Google US English');
                if (googleUS) return googleUS;

                // 2. Samantha (iOS/Mac Default High Quality)
                const samantha = list.find(v => v.name === 'Samantha');
                if (samantha) return samantha;

                // 3. Daniel (iOS/Mac UK High Quality)
                const daniel = list.find(v => v.name === 'Daniel');
                if (daniel) return daniel;

                // 4. Other Good Voices
                const others = ['Karen', 'Arthur', 'Martha', 'Microsoft Zira'];
                for (const name of others) {
                    const found = list.find(v => v.name.includes(name));
                    if (found) return found;
                }

                // 5. Fallback to en-US
                const enUS = list.find(v => v.lang === 'en-US');
                if (enUS) return enUS;

                // 6. Any English
                return list.find(v => v.lang.startsWith('en'));
            }, [voices]);

            // 音声ロードと初期選択
            useEffect(() => {
                const loadVoices = () => { 
                    const v = window.speechSynthesis.getVoices();
                    if (v.length > 0) {
                        setVoices(v);
                        
                        // 初期選択: 明示的に選択されていない場合のみデフォルトを設定
                        if (!selectedVoiceURI) {
                            const preferred = getPreferredVoice(v);
                            if (preferred) setSelectedVoiceURI(preferred.voiceURI);
                        }
                    }
                };
                loadVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = loadVoices;
                }
                
                // Retry for iOS Safari
                const timer = setTimeout(loadVoices, 500);
                const timer2 = setTimeout(loadVoices, 2000); 
                return () => { clearTimeout(timer); clearTimeout(timer2); };
            }, [selectedVoiceURI, getPreferredVoice]); 

            // Data Analysis
            const { fullText, lineStartIndices, sentencesList } = useMemo(() => {
                const lines = lessonData[currentPart];
                let currentLen = 0;
                let allTokens = [];
                const indices = lines.map((line, lIdx) => {
                    const start = currentLen;
                    const tokens = line.text.split(/(\s+|[.,;:"“”?!])/g);
                    tokens.forEach((token, tIdx) => {
                         if (token.trim() && !/^[.,;:"“”?!]+$/.test(token)) {
                             allTokens.push({ text: token, lineIndex: lIdx, wordIndex: tIdx, key: `${lIdx}-${tIdx}` });
                         }
                    });
                    currentLen += line.text.length + 1;
                    return start;
                });

                // Level 3 Logic
                const hiddenSet = new Set();
                let currentSentenceTokens = [];
                let sentences = []; // For playback
                
                const text = lines.map(l => l.text).join(" ");

                const regex = /[^\.!\?]+[\.!\?]+(\s+|$)|[^\.!\?]+$/g;
                let match;
                while ((match = regex.exec(text)) !== null) {
                    const sStart = match.index;
                    const sEnd = match.index + match[0].length;
                    const trimmedText = match[0].trim();
                    if(trimmedText) {
                         sentences.push({ text: trimmedText, start: sStart, end: sEnd });
                    }
                }

                allTokens.forEach((tokenObj) => {
                    currentSentenceTokens.push(tokenObj);
                    const lineText = lines[tokenObj.lineIndex].text;
                    const splitLine = lineText.split(/(\s+|[.,;:"“”?!])/g);
                    const nextChar = splitLine[tokenObj.wordIndex + 1];
                    const isSentenceEnd = nextChar && /[.?!]/.test(nextChar);

                    if (isSentenceEnd || currentSentenceTokens.length > 20) { 
                        const newWordTokens = currentSentenceTokens.filter(t => isNewWord(t.text, currentPart));
                        const contentWordTokens = currentSentenceTokens.filter(t => !isNewWord(t.text, currentPart) && !isFunctionWord(t.text) && !isProperNounOrNumber(t.text));
                        let targets = [...newWordTokens];
                        const targetCount = 4;
                        if (targets.length < targetCount) {
                            const shuffledContent = contentWordTokens.sort(() => 0.5 - Math.random());
                            targets = targets.concat(shuffledContent.slice(0, targetCount - targets.length));
                        }
                        targets.forEach(t => hiddenSet.add(t.key));
                        currentSentenceTokens = [];
                    }
                });
                setLevel3HiddenKeys(hiddenSet);
                
                return { fullText: text, lineStartIndices: indices, sentencesList: sentences };
            }, [currentPart]);

            const handleHiddenWordClick = (key) => {
                setRevealedKeys(prev => { const newSet = new Set(prev); if (newSet.has(key)) newSet.delete(key); else newSet.add(key); return newSet; });
            };

            // 現在選択されている音声オブジェクトを取得
            const getCurrentVoice = () => {
                if (selectedVoiceURI) {
                    return voices.find(v => v.voiceURI === selectedVoiceURI) || getPreferredVoice(voices);
                }
                return getPreferredVoice(voices);
            };

            // Playback Control
            const stopPlayback = () => {
                playbackRef.current.isPausedFlag = false;
                window.speechSynthesis.cancel();
                setIsFullPlaying(false);
                setIsPaused(false);
                setSpeakingRange(null);
                playbackRef.current.sentences = [];
                playbackRef.current.currentIndex = -1;
            };

            const pausePlayback = () => {
                if (isFullPlaying && !isPaused) {
                    playbackRef.current.isPausedFlag = true;
                    window.speechSynthesis.cancel(); 
                    setIsPaused(true);
                }
            };

            const togglePlaybackRate = () => {
                setPlaybackRate(prev => prev === 1.0 ? 0.8 : 1.0);
            };

            const playNextSentence = () => {
                const { sentences, currentIndex, isPausedFlag } = playbackRef.current;
                
                if (isPausedFlag) return;

                const nextIndex = currentIndex + 1;

                if (nextIndex >= sentences.length) {
                    stopPlayback();
                    return;
                }

                playbackRef.current.currentIndex = nextIndex;
                const sentence = sentences[nextIndex];
                
                setSpeakingRange({ start: sentence.start, end: sentence.end });

                const utterance = new SpeechSynthesisUtterance(sentence.text);
                utterance.lang = 'en-US';
                utterance.rate = playbackRate; 
                
                const voice = getCurrentVoice();
                if (voice) {
                    utterance.voice = voice;
                    // iOSの場合、langもvoiceに合わせてセットし直すと確実
                    utterance.lang = voice.lang; 
                }

                utterance.onend = () => {
                    if (!playbackRef.current.isPausedFlag) {
                         playNextSentence();
                    }
                };
                utterance.onerror = () => {
                    if (!playbackRef.current.isPausedFlag) {
                        stopPlayback();
                    }
                };

                window.speechSynthesis.speak(utterance);
            };

            const startOrResumePlayback = () => {
                if (isFullPlaying && !isPaused) return;

                if (isPaused && playbackRef.current.sentences.length > 0) {
                    playbackRef.current.isPausedFlag = false;
                    setIsPaused(false);
                    playbackRef.current.currentIndex -= 1; 
                    playNextSentence();
                } else {
                    stopPlayback(); 
                    setTimeout(() => {
                        setIsFullPlaying(true);
                        setIsPaused(false);
                        playbackRef.current = {
                            sentences: sentencesList,
                            currentIndex: -1,
                            isPausedFlag: false
                        };
                        playNextSentence();
                    }, 50);
                }
            };

            const handleSentenceClick = (lineIndex, tokenIndexInLine, lineText) => {
                if (isFullPlaying) return; 

                const tokens = lineText.split(/(\s+|[.,;:"“”?!])/g);
                let charOffsetInLine = 0;
                for (let i = 0; i < tokenIndexInLine; i++) charOffsetInLine += tokens[i].length;
                const absCharIndex = lineStartIndices[lineIndex] + charOffsetInLine;

                const foundSentence = sentencesList.find(s => absCharIndex >= s.start && absCharIndex < s.end);

                if (!foundSentence) return;

                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(foundSentence.text);
                utterance.lang = 'en-US';
                utterance.rate = playbackRate; 
                
                const voice = getCurrentVoice();
                if (voice) {
                    utterance.voice = voice;
                    utterance.lang = voice.lang;
                }
                
                utterance.onstart = () => setSpeakingRange({ start: foundSentence.start, end: foundSentence.end });
                utterance.onend = () => setSpeakingRange(null);
                utterance.onerror = () => setSpeakingRange(null);
                window.speechSynthesis.speak(utterance);
            };

            const processText = (lineText, level, lineIndex) => {
                const tokens = lineText.split(/(\s+|[.,;:"“”?!])/g);
                let currentCharIndexInLine = 0;
                return tokens.map((token, i) => {
                    const key = `${lineIndex}-${i}`;
                    const isRevealed = revealedKeys.has(key);
                    const tokenLen = token.length;
                    const absStart = lineStartIndices[lineIndex] + currentCharIndexInLine;
                    const absEnd = absStart + tokenLen;
                    currentCharIndexInLine += tokenLen;
                    const isSpeaking = speakingRange && (absStart >= speakingRange.start && absEnd <= speakingRange.end);

                    if (!token.trim() || /^[.,;:"“”?!]+$/.test(token)) return <span key={i} className={isSpeaking ? "speaking-highlight" : ""}>{token}</span>;

                    if (level === 1) return (<span key={i} onClick={() => handleSentenceClick(lineIndex, i, lineText)} className={`speakable-word ${isSpeaking ? "speaking-highlight" : ""}`}>{token}</span>);

                    if (isRevealed) return (<span key={i} onClick={() => handleHiddenWordClick(key)} className="revealed-word mx-0.5" title="Click to hide">{token}</span>);

                    if (level === 2) {
                        if (isNewWord(token, currentPart)) {
                            const firstChar = token.charAt(0);
                            const rest = token.slice(1).replace(/./g, '_');
                            return (<span key={i} onClick={() => handleHiddenWordClick(key)} className="hidden-word theme-text font-bold mx-0.5">{firstChar}<span className="text-gray-300 font-light tracking-widest">{rest}</span></span>);
                        }
                        return (<span key={i} onClick={() => handleSentenceClick(lineIndex, i, lineText)} className={`speakable-word ${isSpeaking ? "speaking-highlight" : ""}`}>{token}</span>);
                    }

                    if (level === 3) {
                         if (level3HiddenKeys.has(key)) {
                             const firstChar = token.charAt(0);
                             const rest = token.slice(1).replace(/./g, '_');
                             return (<span key={i} onClick={() => handleHiddenWordClick(key)} className="hidden-word theme-text font-bold mx-0.5">{firstChar}<span className="text-gray-300 font-light tracking-widest">{rest}</span></span>);
                         }
                         return (<span key={i} onClick={() => handleSentenceClick(lineIndex, i, lineText)} className={`speakable-word ${isSpeaking ? "speaking-highlight" : ""}`}>{token}</span>);
                    }

                    if (level === 4) {
                        const firstChar = token.charAt(0);
                        const rest = token.slice(1).replace(/./g, '_');
                        return (<span key={i} onClick={() => handleHiddenWordClick(key)} className="hidden-word theme-text font-bold mx-0.5">{firstChar}<span className="text-gray-300 font-light tracking-widest">{rest}</span></span>);
                    }
                });
            };

            return (
                <div className="min-h-screen flex flex-col items-center">
                    <div className="w-full theme-bg text-white p-3 shadow-md sticky top-0 z-10">
                        <div className="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
                            <h1 className="text-lg font-bold ui-font tracking-wide whitespace-nowrap flex items-center"><i className="fas fa-book-open mr-2"></i> Lesson 10 Reading Trainer</h1>
                            <div className="flex flex-wrap items-center gap-2 justify-center md:justify-end w-full">
                                <div className="flex space-x-1 bg-black/10 p-1 rounded-lg">
                                    {['part1', 'part2', 'part3'].map((part) => (<button key={part} onClick={() => { setCurrentPart(part); window.scrollTo(0,0); }} className={`px-3 py-1 rounded transition-colors ui-font text-xs font-medium ${currentPart === part ? 'bg-white theme-text shadow' : 'text-white hover:bg-white/20'}`}>{part.replace('part', 'Part ')}</button>))}
                                </div>
                                <div className="flex space-x-1 bg-black/10 p-1 rounded-lg">
                                    {[1, 2, 3, 4].map((lvl) => (<button key={lvl} onClick={() => setLevel(lvl)} className={`px-3 py-1 rounded transition-colors ui-font text-xs font-medium ${level === lvl ? 'bg-white theme-text shadow' : 'text-white hover:bg-white/20'}`}>Lv.{lvl}</button>))}
                                </div>
                                <button 
                                    onClick={() => setIsVoiceSettingsOpen(true)}
                                    className="px-3 py-1.5 rounded-lg ui-font text-xs font-bold bg-white/20 text-white hover:bg-white/30 flex items-center"
                                    title="Voice Settings"
                                >
                                    <i className="fas fa-cog"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="flex-grow w-full max-w-5xl px-4 py-8 overflow-hidden">
                        <div className="bg-white rounded-xl shadow-lg border-t-8 p-6 md:p-12 min-h-[60vh] theme-border">
                            <h2 className="theme-text text-sm font-bold uppercase tracking-widest mb-6 border-b border-gray-200 pb-2 ui-font flex justify-between items-center gap-2">
                                <span className="truncate">Being Different Is Beautiful - {currentPart.replace('part', 'Part ')}</span>
                                <div className="flex space-x-2 flex-shrink-0 items-center">
                                    <button 
                                        onClick={startOrResumePlayback} 
                                        className={`w-10 h-10 rounded-full flex items-center justify-center transition-all ${isFullPlaying && !isPaused ? 'active-play-btn' : 'bg-teal-50 text-teal-700 hover:bg-teal-100'}`}
                                        title="Play"
                                    >
                                        <i className="fas fa-play"></i>
                                    </button>
                                    <button 
                                        onClick={pausePlayback}
                                        disabled={!isFullPlaying || isPaused}
                                        className={`w-10 h-10 rounded-full flex items-center justify-center transition-all ${isPaused ? 'bg-gray-200 text-gray-400' : 'bg-teal-50 text-teal-700 hover:bg-teal-100 disabled:opacity-50'}`}
                                        title="Pause"
                                    >
                                        <i className="fas fa-pause"></i>
                                    </button>
                                    <button 
                                        onClick={stopPlayback}
                                        disabled={!isFullPlaying && !isPaused}
                                        className="w-10 h-10 rounded-full flex items-center justify-center transition-all bg-gray-100 text-gray-500 hover:bg-gray-200 hover:text-red-500 disabled:opacity-50"
                                        title="Stop"
                                    >
                                        <i className="fas fa-stop"></i>
                                    </button>
                                    
                                    {/* Speed Toggle Button */}
                                    <button 
                                        onClick={togglePlaybackRate}
                                        className="h-8 px-2 ml-2 rounded text-xs font-bold transition-all bg-gray-100 text-gray-600 hover:bg-gray-200 border border-gray-300"
                                        title="Toggle Speed"
                                    >
                                        {playbackRate.toFixed(1)}x
                                    </button>
                                </div>
                            </h2>
                            <div className="text-2xl md:text-3xl leading-[2.0] text-gray-800 overflow-x-auto custom-scrollbar pb-4">
                                <div className="min-w-max">
                                    {lessonData[currentPart].map((line, index) => (
                                        <div key={index} className={`mb-4 min-h-[1.5em] whitespace-nowrap ${line.indent ? 'pl-8' : ''}`}>
                                            {processText(line.text, level, index)}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <VoiceSettingsModal 
                        isOpen={isVoiceSettingsOpen} 
                        onClose={() => setIsVoiceSettingsOpen(false)}
                        voices={voices}
                        selectedVoiceURI={selectedVoiceURI}
                        onSelectVoice={(uri) => setSelectedVoiceURI(uri)}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
